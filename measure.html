<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>measure</title>
<body><script>
// Temporary helper for comparing the static copy with WordPress. Delete after the switch.
const sig=s=>{let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return (h>>>0).toString(36)};
async function m1(p,width){const f=document.createElement('iframe');f.style.cssText=`position:fixed;left:-5000px;top:0;width:${width}px;height:900px;border:0`;document.body.appendChild(f);let r;try{await new Promise(res=>{f.onload=res;setTimeout(res,25000);f.src=p});const d=f.contentDocument,w=f.contentWindow;await new Promise(x=>setTimeout(x,1800));try{await d.fonts.ready}catch(e){};d.querySelectorAll('#scb-banner,#scb-overlay,#wpadminbar').forEach(e=>e.remove());const vis=e=>{const s=w.getComputedStyle(e);return e.offsetParent!==null&&s.visibility!=='hidden'&&s.display!=='none'};const wid=[...d.querySelectorAll('.elementor-widget')].filter(x=>!x.closest('.elementor-sticky__spacer')&&!x.closest('.elementor-location-popup')&&vis(x)).map(x=>[x.dataset.widget_type,Math.round(x.getBoundingClientRect().height)]).filter(x=>x[1]>0);const bf=[...new Set([...d.fonts].filter(x=>x.status==='error').map(x=>x.family))];const bi=[...d.images].filter(i=>i.complete&&i.naturalWidth===0&&vis(i)&&!/ytimg|facebook|gravatar|google/.test(i.src)).length;r=[d.documentElement.scrollWidth,sig(wid.map(x=>x[0]).join(',')),bf.length,bi,...wid.map(x=>x[1])];r.types=wid.map(x=>x[0])}catch(e){r=['ERR',String(e).slice(0,60)]}f.remove();return r}
window.addEventListener('message',async e=>{if(e.origin!=='https://www.victory.org.il'||!e.data||!e.data.paths)return;const out={};for(const p of e.data.paths){const m=await m1(p,375),d=await m1(p,1366);out[p]={m,d,mt:m.types,dt:d.types};e.source.postMessage({progress:Object.keys(out).length},e.origin)}e.source.postMessage({res:out},e.origin)});
</script>
